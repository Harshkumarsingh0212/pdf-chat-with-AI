services:
  # FastAPI backend — handles PDF upload, embedding, and Gemini Q&A.
  - type: web
    name: pdf-chat-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir fastapi
    # NOTE: must stay "/" — "/status/" requires an X-Session-Id header for
    # per-visitor session isolation, which Render's health checker won't send.
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false # set manually in the Render dashboard, never commit this

  # Vite/React frontend — static site, built once and served from a CDN.
  - type: web
    name: pdf-chat-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the backend's live URL after it's deployed, e.g. https://pdf-chat-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
